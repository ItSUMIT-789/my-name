<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Welcome to Sumit's personal page.">
  <title>Sumit</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #1677ff;
      --ink: #111827;
      --muted: #5b6578;
      --line: #edf0f5;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    header {
      height: 76px;
      padding: 0 clamp(22px, 6.2vw, 100px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: var(--ink);
      font-size: 26px;
      font-weight: 750;
      letter-spacing: -1px;
      text-decoration: none;
    }

    nav { display: flex; gap: clamp(18px, 3vw, 48px); }

    nav a {
      color: #4b5568;
      font-size: 15px;
      text-decoration: none;
      padding: 10px 0;
      transition: color .2s ease;
    }

    nav a:hover, nav a.active { color: var(--blue); }

    nav a.active { border-bottom: 2px solid var(--blue); }

    main {
      min-height: calc(100vh - 76px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 22px 100px;
      text-align: center;
    }

    .hero { width: 100%; max-width: 850px; }

    .welcome {
      margin: 0 0 36px;
      color: var(--muted);
      font-size: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(54px, 8vw, 100px);
      line-height: 1.04;
      letter-spacing: -5px;
      font-weight: 780;
    }

    h1 span {
      display: block;
      margin-top: 5px;
      color: var(--blue);
    }

    .intro {
      max-width: 720px;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: clamp(16px, 2.2vw, 22px);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 36px;
    }

    .button {
      min-height: 52px;
      padding: 0 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--blue);
      border-radius: 9px;
      color: var(--blue);
      background: #fff;
      font-size: 16px;
      font-weight: 650;
      text-decoration: none;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .button.primary { color: #fff; background: var(--blue); }
    .button:hover { transform: translateY(-1px); }
    .button.primary:hover { background: #0867e8; }
    .button.secondary:hover { background: #f3f8ff; }

    @media (max-width: 560px) {
      header { height: auto; min-height: 72px; padding: 16px 20px; }
      .brand { font-size: 23px; }
      nav { gap: 13px; }
      nav a { font-size: 13px; }
      main { min-height: calc(100vh - 72px); padding-top: 55px; }
      .welcome { margin-bottom: 27px; font-size: 16px; }
      h1 { letter-spacing: -3px; }
      .intro { margin-top: 22px; }
      .actions { margin-top: 28px; }
      .button { min-height: 48px; padding: 0 18px; font-size: 14px; }
    }

    @media (max-width: 380px) {
      nav { gap: 9px; }
      nav a { font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#home" aria-label="Sumit home">Sumit</a>
    <nav aria-label="Main navigation">
      <a class="active" href="#home">Home</a>
      <a href="#about">About</a>
      <a href="https://github.com/ItSUMIT-789" target="_blank" rel="noopener noreferrer">Projects</a>
      <a href="mailto:">Contact</a>
    </nav>
  </header>

  <main id="home">
    <section class="hero" id="about" aria-labelledby="hero-title">
      <p class="welcome">Welcome to my page 👋</p>
      <h1 id="hero-title">Hello, I'm <span>Sumit</span></h1>
      <p class="intro">A Computer Engineering Student | Full-Stack Developer | Aspiring DevOps Engineer</p>
      <div class="actions">
        <a class="button primary" href="https://github.com/ItSUMIT-789" target="_blank" rel="noopener noreferrer">View My Projects</a>
        <a class="button secondary" href="https://www.linkedin.com/in/sumit-shidole/" target="_blank" rel="noopener noreferrer">Contact Me</a>
      </div>
    </section>
  </main>
</body>
</html>
