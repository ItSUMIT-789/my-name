<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Welcome to Sumit's personal page.">
  <title>Sumit | Personal Page</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #1677ff;
      --ink: #111827;
      --muted: #5b6578;
      --line: #edf0f5;
      --cell: 12px; /* keep in sync with CELL in the script */
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    /* ---------- Pixel trail background ---------- */
    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: #f6f8f7;
      background-image:
        linear-gradient(to right, rgba(17, 24, 39, .06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(17, 24, 39, .06) 1px, transparent 1px);
      background-size: var(--cell) var(--cell);
    }

    #pixel-trail {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    header, main { position: relative; z-index: 1; }

    header {
      height: 76px;
      padding: 0 clamp(22px, 6.2vw, 100px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .brand {
      color: var(--ink);
      font-size: 26px;
      font-weight: 750;
      letter-spacing: -1px;
      text-decoration: none;
    }

    nav { display: flex; gap: clamp(18px, 3vw, 48px); }

    nav a {
      color: #4b5568;
      font-size: 15px;
      text-decoration: none;
      padding: 10px 0;
      transition: color .2s ease;
    }

    nav a:hover, nav a.active { color: var(--blue); }

    nav a.active { border-bottom: 2px solid var(--blue); }

    main {
      min-height: calc(100vh - 76px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 22px 100px;
      text-align: center;
    }

    .hero { width: 100%; max-width: 850px; }

    .welcome {
      margin: 0 0 36px;
      color: var(--muted);
      font-size: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(54px, 8vw, 100px);
      line-height: 1.04;
      letter-spacing: -5px;
      font-weight: 780;
    }

    h1 span {
      display: block;
      margin-top: 5px;
      color: var(--blue);
    }

    .intro {
      max-width: 720px;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: clamp(16px, 2.2vw, 22px);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 36px;
    }

    .button {
      min-height: 52px;
      padding: 0 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--blue);
      border-radius: 9px;
      color: var(--blue);
      background: #fff;
      font-size: 16px;
      font-weight: 650;
      text-decoration: none;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .button.primary { color: #fff; background: var(--blue); }
    .button:hover { transform: translateY(-1px); }
    .button.primary:hover { background: #0867e8; }
    .button.secondary:hover { background: #f3f8ff; }

    @media (max-width: 560px) {
      header { height: auto; min-height: 72px; padding: 16px 20px; }
      .brand { font-size: 23px; }
      nav { gap: 13px; }
      nav a { font-size: 13px; }
      main { min-height: calc(100vh - 72px); padding-top: 55px; }
      .welcome { margin-bottom: 27px; font-size: 16px; }
      h1 { letter-spacing: -3px; }
      .intro { margin-top: 22px; }
      .actions { margin-top: 28px; }
      .button { min-height: 48px; padding: 0 18px; font-size: 14px; }
    }

    @media (max-width: 380px) {
      nav { gap: 9px; }
      nav a { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #pixel-trail { display: none; }
    }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="pixel-trail" aria-hidden="true"></canvas>

  <header>
    <a class="brand" href="#home" aria-label="Sumit home">Sumit</a>
    <nav aria-label="Main navigation">
      <a class="active" href="#home">Home</a>
      <a href="#about">About</a>
      <a href="https://github.com/ItSUMIT-789" target="_blank" rel="noopener noreferrer">Projects</a>
      <a href="mailto:">Contact</a>
    </nav>
  </header>

  <main id="home">
    <section class="hero" id="about" aria-labelledby="hero-title">
      <p class="welcome">Welcome to my page 👋</p>
      <h1 id="hero-title">Hello, I'm <span>Sumit</span></h1>
      <p class="intro">A Computer Engineering Student | Full-Stack Developer | Aspiring DevOps Engineer</p>
      <div class="actions">
        <a class="button primary" href="https://github.com/ItSUMIT-789" target="_blank" rel="noopener noreferrer">View My Projects</a>
        <a class="button secondary" href="https://www.linkedin.com/in/sumit-shidole/" target="_blank" rel="noopener noreferrer">Contact Me</a>
      </div>
    </section>
  </main>

  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var CELL = 12;                       // grid cell size in px (match --cell in CSS)
      var PALETTE = [                      // greens, blues and orange like the GitHub style
        '#1a9c3f', '#0f7a32', '#4ade80', '#6ee7a0',
        '#1677ff', '#5aa9ff', '#9fd0ff', '#c4a1ff', '#d9731a'
      ];
      var canvas = document.getElementById('pixel-trail');
      var ctx = canvas.getContext('2d');
      var pixels = new Map();              // "x,y" -> pixel
      var last = null;
      var running = false;
      var dpr = 1, w = 0, h = 0;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      function rand(a, b) { return a + Math.random() * (b - a); }

      function addPixel(cx, cy, life) {
        pixels.set(cx + ',' + cy, {
          x: cx,
          y: cy,
          color: PALETTE[(Math.random() * PALETTE.length) | 0],
          born: performance.now(),
          life: life || rand(450, 750)
        });
      }

      function onMove(e) {
        var cx = Math.floor(e.clientX / CELL);
        var cy = Math.floor(e.clientY / CELL);
        if (last && last.x === cx && last.y === cy) return;
        addPixel(cx, cy);
        last = { x: cx, y: cy };
        start();
      }

      window.addEventListener('pointermove', onMove, { passive: true });
      window.addEventListener('pointerleave', function () { last = null; });
      document.addEventListener('mouseleave', function () { last = null; });

      function start() {
        if (running) return;
        running = true;
        requestAnimationFrame(frame);
      }

      function frame(now) {
        ctx.clearRect(0, 0, w, h);
        pixels.forEach(function (p, key) {
          var t = (now - p.born) / p.life;
          if (t >= 1) { pixels.delete(key); return; }
          // hold full size briefly, then shrink quickly toward the cell centre
          var k = t < 0.25 ? 1 : 1 - Math.pow((t - 0.25) / 0.75, 0.6);
          var size = (CELL - 1) * k;
          var off = ((CELL - 1) - size) / 2;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x * CELL + off, p.y * CELL + off, size, size);
        });
        if (pixels.size) requestAnimationFrame(frame);
        else running = false;
      }
    })();
  </script>
</body>
</html>
